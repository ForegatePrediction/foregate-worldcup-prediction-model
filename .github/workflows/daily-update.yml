name: Daily Elo update

# Refresh national-team Elo from eloratings.net, re-run the simulation, rebuild datasets,
# and commit the changes. Runs once a day during the tournament (and on manual trigger).
on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Refresh Elo, re-simulate, rebuild
        run: node update-elo.mjs
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ outputs/
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Daily Elo update — $(date -u +%Y-%m-%d)"
            git push
          fi
